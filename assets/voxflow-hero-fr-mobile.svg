<text x="74" y="835" font-size="44" fill="#9BE5B5" font-weight="600" >FacilAbo</text>
<text x="74" y="878" font-size="34" fill="#B7BDC5" font-weight="400" >Directement dans votre texte.</text>
<text x="74" y="918" font-size="34" fill="#B7BDC5" font-weight="400" >Comme vous le faites déjà.</text>
