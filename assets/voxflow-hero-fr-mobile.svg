<text x="120" y="82" font-size="42" fill="#F5F5F3" font-weight="600" >VoxFlow</text>
<text x="42" y="152" font-size="34" fill="#B7BDC5" font-weight="500" >LA DICTÉE QUI APPREND VOS MOTS</text>
<text x="42" y="219" font-size="62" fill="#F5F5F3" font-weight="650" >Parlez.</text>
<text x="42" y="289" font-size="62" fill="#F5F5F3" font-weight="650" >Le texte suit.</text>
