<text x="1374" y="81" font-size="25" fill="#B7BDC5" font-weight="500" text-anchor="end">LA DICTÉE QUI APPREND VOS MOTS</text>
<text x="66" y="216" font-size="72" fill="#F5F5F3" font-weight="650" >Parlez. Le texte suit.</text>
